# Template File: Generated by Matugen
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Better split keys
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g mode-keys vi

# Better copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

## --- Matugen Color Palette ---
# Background / Surface
bg="{{colors.background.default.hex}}"
bg_alt="{{colors.surface.default.hex}}"

# Foreground / Text
fg="{{colors.on_surface.default.hex}}"
gray="{{colors.on_surface_variant.default.hex}}"

# Accent colors
blue="{{colors.primary.default.hex}}"
purple="{{colors.secondary.default.hex}}"
green="{{colors.primary.default.hex}}"
yellow="{{colors.tertiary.default.hex}}"
red="{{colors.error.default.hex}}"

# Proper text colors on accent backgrounds
on_blue="{{colors.on_primary.default.hex}}"
on_purple="{{colors.on_secondary.default.hex}}"
on_green="{{colors.on_primary.default.hex}}"
on_yellow="{{colors.on_tertiary.default.hex}}"
on_red="{{colors.on_error.default.hex}}"

### --- General UI ---
set -g status-style "bg=$bg,fg=$fg"
set -g message-style "bg=$bg_alt,fg=$fg"
set -g pane-border-style "fg=$gray"
set -g pane-active-border-style "fg=$blue"
set -g status-interval 5
set -g status-justify left

### --- Left side ---
set -g status-left-length 40
set -g status-left "#[bg=$green,fg=$on_green,bold] 󰆍 #[fg=$green,bg=$bg]"

### --- Window list ---
setw -g window-status-separator ""

setw -g window-status-format \
"#[bg=$bg,fg=$gray] #I:#W "

setw -g window-status-current-format \
"#[bg=$green,fg=$bg,bold] #I:#W #[fg=$green,bg=$bg]"

### --- Right side with time and user ---
set -g status-right-length 60
set -g status-right "#[fg=$purple,bg=$bg]#[bg=$purple,fg=$on_purple,bold] 󰥔 %I:%M %p #[fg=$green,bg=$purple]#[bg=$green,fg=$on_green,bold] 󰍹 alamin@alfa "

### --- Activity/Bell with Nerd Font icons ---
setw -g window-status-activity-style "fg=$yellow,bold"
setw -g window-status-bell-style "fg=$red,bold"


# ─────────────────────────────────────
# TPM Plugins
# ─────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# plugin 2
# plugin 3 ..

# Initialize TPM plugins before overriding tmux-resurrect's restore binding.
run '~/.tmux/plugins/tpm/tpm'

unbind C-r
bind C-r display-popup -E -w 80% -h 70% "$HOME/.local/bin/tmux-resurrect-picker"
