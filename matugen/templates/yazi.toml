# Generated by matugen — do not edit by hand.

[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }

# Hovered
hovered         = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "{{colors.tertiary.default.hex}}", italic = true }
find_position = { fg = "{{colors.tertiary.default.hex}}", bg = "reset", italic = true }

# Marker
marker_copied   = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
marker_cut      = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked   = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_selected = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }

# Tab
tab_active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
tab_inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
tab_width    = 1

# Count
count_copied   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
count_cut      = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }
count_selected = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }

# Border
border_symbol = "│"
border_style  = { fg = "{{colors.outline_variant.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

select_main = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

unset_main  = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
unset_alt   = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
progress_error  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

# Permissions
perm_sep   = { fg = "{{colors.outline.default.hex}}" }
perm_type  = { fg = "{{colors.primary.default.hex}}" }
perm_read  = { fg = "{{colors.tertiary.default.hex}}" }
perm_write = { fg = "{{colors.error.default.hex}}" }
perm_exec  = { fg = "{{colors.secondary.default.hex}}" }

[which]
cols            = 3
mask            = { bg = "{{colors.surface.default.hex}}" }
cand            = { fg = "{{colors.primary.default.hex}}" }
rest            = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc            = { fg = "{{colors.on_surface.default.hex}}" }
separator       = "  "
separator_style = { fg = "{{colors.outline.default.hex}}" }

[confirm]
border     = { fg = "{{colors.primary.default.hex}}" }
title      = { fg = "{{colors.primary.default.hex}}" }
content    = {}
list       = { fg = "{{colors.on_surface.default.hex}}" }
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  (n)o  " ]

[spot]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}" }
tbl_col  = { fg = "{{colors.tertiary.default.hex}}" }
tbl_cell = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }

[notify]
title_info  = { fg = "{{colors.primary.default.hex}}" }
title_warn  = { fg = "{{colors.tertiary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }
icon_info   = ""
icon_warn   = ""
icon_error  = ""

[pick]
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{colors.tertiary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}" }

[input]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.on_surface.default.hex}}" }
value    = { fg = "{{colors.on_surface.default.hex}}" }
selected = { reversed = true }

[cmp]
border       = { fg = "{{colors.primary.default.hex}}" }
active       = { fg = "{{colors.tertiary.default.hex}}", bold = true }
inactive     = { fg = "{{colors.on_surface_variant.default.hex}}" }
icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = { fg = "{{colors.on_surface.default.hex}}" }
hovered = { fg = "{{colors.tertiary.default.hex}}", underline = true }

[help]
on      = { fg = "{{colors.primary.default.hex}}" }
run     = { fg = "{{colors.tertiary.default.hex}}" }
hovered = { reversed = true, bold = true }
footer  = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "{{colors.tertiary.default.hex}}" },

	# Media
	{ mime = "{audio,video}/*", fg = "{{colors.secondary.default.hex}}" },

	# Archives
	{ mime = "application/{,g}zip", fg = "{{colors.error.default.hex}}" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "{{colors.error.default.hex}}" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "{{colors.on_surface.default.hex}}" },

	# Fallback
	{ url = "*", fg = "{{colors.on_surface.default.hex}}" },
	{ url = "*/", fg = "{{colors.primary.default.hex}}" },

	# Special files
	{ url = "*", is = "orphan", fg = "{{colors.error.default.hex}}" },
	{ url = "*", is = "exec",   fg = "{{colors.secondary.default.hex}}" },
	{ url = "*", is = "link",   fg = "{{colors.tertiary.default.hex}}" },
	{ url = "*", is = "block",  fg = "{{colors.secondary.default.hex}}" },
	{ url = "*", is = "char",   fg = "{{colors.secondary.default.hex}}" },
	{ url = "*", is = "fifo",   fg = "{{colors.secondary.default.hex}}" },
	{ url = "*", is = "sock",   fg = "{{colors.secondary.default.hex}}" },
	{ url = "*", is = "sticky", fg = "{{colors.tertiary.default.hex}}" },
]
