# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

# NOTE: override the dynamic border color 
    # $color12=rgb(00FFFF)

general {
 
  border_size = 3 # 2 given
  gaps_in = 6 # 2 given
  gaps_out = 10 #4 was given 
  col.active_border = $color12 
  col.inactive_border = $color10
}

decoration {
  rounding = 15
         
  active_opacity = 1.0
  inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.8

  shadow {
    enabled = true
    range = 3
    render_power = 03

    color =  $color12
    color_inactive = $color10
  }


  blur {
    enabled = true	
    size = 7 #6
    passes = 3
#    noise = 0.08
    contrast = 1.5 
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
    xray = false
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}
