## --- TokyoNight Night Palette ---
bg="#1a1b26"
bg_alt="#2998ec"
fg="#c0caf5"
gray="#565f89"
blue="#7aa2f7"
purple="#9d7cd8"
green="#73daca"
yellow="#e0af68"
red="#f7768e"

### --- General UI ---
set -g status-style "bg=$bg,fg=$red"
set -g message-style "bg=$bg_alt,fg=$fg"
set -g pane-border-style "fg=$gray"
set -g pane-active-border-style "fg=$blue"
set -g status-interval 5
set -g status-justify left

### --- Left side: session name ---
set -g status-left-length 40
set -g status-left "#[bg=$blue,fg=$bg,bold] #S #[bg=$bg,fg=$blue]│ "

### --- Window list ---
setw -g window-status-format "#[fg=$fg] #I:#W "
setw -g window-status-current-format "#[bg=$green,fg=$bg,bold] #I:#W #[bg=$bg,fg=$green]"
setw -g window-status-separator ""

### --- Right side ---
set -g status-right-length 50
set -g status-right "#[fg=$green]│#[bg=$green,fg=$bg,bold] ⚡alamin@alfa "

### --- Activity/Bell ---
setw -g window-status-activity-style "fg=$yellow,bold"
setw -g window-status-bell-style "fg=$red,bold"

### --- Plugins (if using TPM) ---
set -g @plugin 'tmux-plugins/tpm'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
